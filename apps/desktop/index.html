<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HyMail</title>
    <script>
      // Applies the saved theme before first paint so a dark-mode reload does
      // not flash white. Keep the key in sync with src/lib/theme.ts.
      (function () {
        try {
          var stored = localStorage.getItem("hymail.theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.classList.add("dark");
          }
        } catch (error) {
          /* storage unavailable; fall back to the light default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
