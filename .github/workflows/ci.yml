name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  api:
    name: API
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @hymail/desktop lint
      - name: Typecheck
        run: pnpm --filter @hymail/desktop typecheck
      - name: Test
        run: pnpm --filter @hymail/desktop test
      - name: Build
        run: pnpm --filter @hymail/desktop build